<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Горный Алтай | Путешествие мечты</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1f2c1d;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', 'Roboto', system-ui, sans-serif;
            padding: 24px;
        }

        /* Контейнер для страниц A4 */
        .pages-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 32px;
        }

        /* Стиль каждого листа — строгий формат А4 */
        .page {
            width: 210mm;
            min-height: 297mm;
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            position: relative;
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.4);
            border-radius: 6px;
            background-color: #cfc7b2; /* fallback */
        }

        /* Лист №1 фон */
        .page-1 {
            background-image: url('https://avatars.mds.yandex.net/i?id=c43d745f215c5ca86c66724caa0e9f49_l-9716553-images-thumbs&n=13');
            background-size: cover;
        }

        /* Лист №2 фон */
        .page-2 {
            background-image: url('https://avatars.mds.yandex.net/get-mpic/1865723/img_id5636216467171043506.jpeg/9hq');
            background-size: cover;
        }

        /* Скрытая страница */
        .hidden-page {
            display: none;
        }

        /* Контейнер для двухстрочного заголовка */
        .title-block {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            width: 100%;
            pointer-events: none;
            z-index: 8;
        }

        .title-line-first {
            font-family: 'Algerian', 'Copperplate Gothic', 'Times New Roman', cursive;
            font-size: 100px;
            font-weight: bold;
            color: #FFF2C4;
            text-shadow: 8px 8px 18px #1f3b2c, 4px 4px 8px #00000099;
            letter-spacing: 2px;
            line-height: 1.15;
            white-space: nowrap;
        }

        .title-line-second {
            font-family: 'Algerian', 'Copperplate Gothic', 'Times New Roman', cursive;
            font-size: 70px;
            font-weight: bold;
            color: #FFF2C4;
            text-shadow: 6px 6px 14px #1f3b2c, 3px 3px 6px #00000099;
            letter-spacing: 1px;
            line-height: 1.2;
            white-space: nowrap;
        }

        /* Адаптация заголовка при узком экране (перенос строк) */
        @media (max-width: 220mm) {
            .title-line-first {
                font-size: 12vw;
                white-space: normal;
                word-break: keep-all;
            }
            .title-line-second {
                font-size: 8vw;
                white-space: normal;
                word-break: keep-all;
            }
            .title-block {
                width: 90%;
            }
        }

        /* Кнопка Регистрация (левый верх: 15мм от лева и верха) */
        .reg-btn {
            position: absolute;
            left: 15mm;
            top: 15mm;
            background: linear-gradient(145deg, #2a6b47, #1c4e33);
            border: none;
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 8px 24px;
            border-radius: 42px;
            cursor: pointer;
            font-family: inherit;
            box-shadow: 0 5px 0 #0e3a24;
            transition: 0.08s linear;
            z-index: 20;
            min-width: 140px;
            text-align: center;
            letter-spacing: 1px;
        }

        .reg-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #0e3a24;
        }

        /* Блок "Войти" — 1.5см от правого, 15мм от верха, со своими полями */
        .login-block {
            position: absolute;
            top: 15mm;
            right: 15mm;
            width: 280px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 18px 20px;
            border: 1px solid rgba(255, 215, 130, 0.75);
            box-shadow: 0 12px 28px rgba(0,0,0,0.4);
            z-index: 25;
            font-family: 'Segoe UI', sans-serif;
        }

        .login-title {
            font-size: 1.6rem;
            font-weight: bold;
            text-align: center;
            color: #ffdf8c;
            margin-bottom: 16px;
            letter-spacing: 1px;
        }

        .field-group {
            margin-bottom: 14px;
        }

        .field-group label {
            display: block;
            font-size: 0.8rem;
            color: #f7e5c2;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .login-block input {
            width: 100%;
            padding: 8px 12px;
            border-radius: 60px;
            border: none;
            background: #fff9ef;
            font-size: 0.9rem;
            outline: none;
        }

        .login-block input:focus {
            box-shadow: 0 0 0 2px #ffaa44;
        }

        .login-submit {
            width: 100%;
            background: #e67e22;
            border: none;
            padding: 9px;
            border-radius: 50px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 8px;
            transition: 0.1s;
        }

        .login-submit:hover {
            background: #f39c12;
        }

        .error-message {
            font-size: 0.7rem;
            color: #ffbda1;
            text-align: center;
            margin-top: 10px;
            min-height: 22px;
        }

        /* Модальное окно регистрации (логин/пароль) */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-card {
            background: #fef7e8;
            width: 360px;
            padding: 30px 24px 36px;
            border-radius: 56px 28px 56px 28px;
            text-align: center;
            box-shadow: 0 25px 40px rgba(0,0,0,0.5);
            border-left: 6px solid #cc8844;
            border-bottom: 6px solid #cc8844;
        }

        .modal-card h3 {
            font-family: 'Algerian', cursive;
            font-size: 30px;
            color: #2c5a3b;
            margin-bottom: 20px;
        }

        .modal-card input {
            width: 90%;
            padding: 10px 14px;
            margin: 12px 0;
            border: 1px solid #bd8a48;
            border-radius: 60px;
            font-size: 1rem;
        }

        .modal-buttons {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-top: 24px;
        }

        .modal-buttons button {
            flex: 1;
            padding: 9px;
            border: none;
            border-radius: 44px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
        }

        .modal-reg {
            background: #2d6a4f;
            color: white;
        }

        .modal-cancel {
            background: #a76c3a;
            color: white;
        }

        /* Стили карточек (кнопок) второго листа */
        .tour-card {
            position: absolute;
            width: 5cm;
            height: 8cm;
            background-size: cover;
            background-position: center;
            border-radius: 28px;
            border: 3px solid #ffdb8e;
            box-shadow: 0 14px 28px rgba(0, 0, 0, 0.6);
            cursor: pointer;
            transition: 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 12px;
        }

        .tour-card:hover {
            transform: scale(1.02);
            border-color: #ffbb44;
            filter: brightness(1.02);
        }

        /* подпись под кнопкой (отдельный текст вне карточки, но под ней) */
        .card-caption {
            position: absolute;
            bottom: -32px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 1rem;
            font-weight: bold;
            color: #fcf3cf;
            text-shadow: 2px 2px 4px #1f2c1b;
            background: rgba(0,0,0,0.55);
            backdrop-filter: blur(8px);
            display: inline-block;
            width: fit-content;
            margin: 0 auto;
            padding: 5px 16px;
            border-radius: 60px;
            letter-spacing: 1px;
            pointer-events: none;
            white-space: nowrap;
        }

        /* контейнер для карточки + подпись (относительное позиционирование) */
        .card-wrapper {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* первая кнопка: левый край 20мм, верхний край 150мм */
        .hiking-wrapper {
            left: 20mm;
            top: 150mm;
        }

        /* вторая кнопка: расстояние от левого края 12см, от верха 150мм */
        .rafting-wrapper {
            left: 12cm;
            top: 150mm;
        }

        .card-wrapper .tour-card {
            position: relative;
            left: 0;
            top: 0;
        }

        /* Кнопка возврата на Лист №1 (навигация) */
        .back-home-btn {
            position: absolute;
            bottom: 25mm;
            left: 20mm;
            background: #2f2a24cc;
            backdrop-filter: blur(8px);
            border: 1px solid #f5cb8b;
            color: #ffefc0;
            padding: 8px 20px;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
            transition: 0.1s;
            font-size: 0.9rem;
            z-index: 30;
        }

        .back-home-btn:hover {
            background: #594f41cc;
            color: white;
        }

        /* адаптив и печать */
        @media print {
            body {
                background: white;
                padding: 0;
            }
            .page {
                box-shadow: none;
                margin: 0;
                page-break-after: avoid;
            }
            .reg-btn, .login-block, .modal, .back-home-btn {
                display: none;
            }
        }

        @media (max-width: 230mm) {
            .page {
                transform: scale(0.92);
                margin: 12px auto;
            }
            .hiking-wrapper, .rafting-wrapper {
                transform: scale(0.95);
            }
        }

        /* мелкие правки */
        .info-hint {
            position: absolute;
            bottom: 12px;
            left: 15mm;
            background: rgba(0,0,0,0.55);
            color: #fae67a;
            font-size: 10px;
            padding: 4px 12px;
            border-radius: 28px;
            z-index: 22;
            pointer-events: none;
        }
    </style>
</head>
<body>
<div class="pages-container">
    <!-- ЛИСТ №1 -->
    <div id="page1" class="page page-1">
        <!-- Двухстрочная надпись по центру: "Путешествие" (100px) и "по Горному Алтаю" (70px) -->
        <div class="title-block">
            <div class="title-line-first">Путешествие</div>
            <div class="title-line-second">по Горному Алтаю</div>
        </div>

        <!-- Кнопка Регистрация (левый верх 15 мм) -->
        <button id="registrationBtn" class="reg-btn">📝 Регистрация</button>

        <!-- Блок "Войти" (1.5 см от правого края, 15 мм сверху) -->
        <div class="login-block">
            <div class="login-title">🔐 Войти</div>
            <div class="field-group">
                <label>Логин</label>
                <input type="text" id="loginField" placeholder="Ваш логин">
            </div>
            <div class="field-group">
                <label>Пароль</label>
                <input type="password" id="passwordField" placeholder="Пароль">
            </div>
            <button id="doLoginBtn" class="login-submit">➡️ Войти</button>
            <div id="loginError" class="error-message"></div>
        </div>

        <!-- маленькая подсказка (не мешает, улучшает UX) -->
        <div class="info-hint">🔑 тестовый вход: altai / altai2025</div>
    </div>

    <!-- ЛИСТ №2 (формат А4) -->
    <div id="page2" class="page page-2 hidden-page">
        <!-- Карточка похода "Под рюкзаком" - кнопка 5x8 см, от левого края 20 мм, от верхнего края 150 мм -->
        <div class="card-wrapper hiking-wrapper">
            <div id="hikingBtn" class="tour-card" style="background-image: url('https://png.pngtree.com/background/20230614/original/pngtree-man-walking-up-a-mountain-with-a-backpack-picture-image_3481455.jpg'); background-size: cover;">
                <!-- сама картинка в фоне -->
            </div>
            <div class="card-caption">🥾 Под рюкзаком</div>
        </div>

        <!-- Карточка сплава "По воде" - расстояние от левого края 12см, от верха 150мм -->
        <div class="card-wrapper rafting-wrapper">
            <div id="raftingBtn" class="tour-card" style="background-image: url('https://altaiactive.ru/wp-content/uploads/2023/03/splav-po-katuni.jpg'); background-size: cover;">
            </div>
            <div class="card-caption">🌊 По воде</div>
        </div>

        <!-- Кнопка "Назад" для возврата на Лист №1 (удобство навигации) -->
        <button id="backToFirstPage" class="back-home-btn">◀ Назад</button>
    </div>
</div>

<!-- МОДАЛЬНОЕ ОКНО для регистрации (логин и пароль) -->
<div id="regModal" class="modal">
    <div class="modal-card">
        <h3>🏔 РЕГИСТРАЦИЯ</h3>
        <input type="text" id="regLoginInput" placeholder="Придумайте логин">
        <input type="password" id="regPasswordInput" placeholder="Придумайте пароль">
        <div id="modalMsg" style="font-size:12px; margin-top:8px; color:#9b4b1a;"></div>
        <div class="modal-buttons">
            <button id="confirmRegBtn" class="modal-reg">Зарегистрироваться</button>
            <button id="cancelRegBtn" class="modal-cancel">Отмена</button>
        </div>
    </div>
</div>

<script>
    // ------ Управление страницами ------
    const page1 = document.getElementById('page1');
    const page2 = document.getElementById('page2');

    function showPage1() {
        page1.classList.remove('hidden-page');
        page2.classList.add('hidden-page');
        // сбросим сообщения об ошибках и поля на листе 1
        const errorDiv = document.getElementById('loginError');
        if (errorDiv) errorDiv.innerText = '';
        document.getElementById('loginField').value = '';
        document.getElementById('passwordField').value = '';
    }

    function showPage2() {
        page1.classList.add('hidden-page');
        page2.classList.remove('hidden-page');
        const errorDiv = document.getElementById('loginError');
        if (errorDiv) errorDiv.innerText = '';
    }

    // ------ Работа с пользователями (localStorage) ------
    let users = JSON.parse(localStorage.getItem('altaiUsers')) || [];

    // добавим демо-пользователя для простоты тестирования, если массив пуст
    if (users.length === 0) {
        users.push({ login: 'altai', password: 'altai2025' });
        users.push({ login: 'user', password: '123' });
        localStorage.setItem('altaiUsers', JSON.stringify(users));
    }

    function saveUsersToStorage() {
        localStorage.setItem('altaiUsers', JSON.stringify(users));
    }

    function registerNewUser(login, password) {
        const trimmedLogin = login.trim();
        const trimmedPass = password.trim();
        if (!trimmedLogin || !trimmedPass) {
            return { success: false, message: 'Логин и пароль не могут быть пустыми' };
        }
        const exists = users.some(u => u.login === trimmedLogin);
        if (exists) {
            return { success: false, message: 'Пользователь с таким логином уже существует' };
        }
        users.push({ login: trimmedLogin, password: trimmedPass });
        saveUsersToStorage();
        return { success: true, message: 'Регистрация успешна! Теперь войдите.' };
    }

    function checkLogin(login, password) {
        return users.some(u => u.login === login && u.password === password);
    }

    // ------ Модальное окно регистрации ------
    const modal = document.getElementById('regModal');
    const regBtn = document.getElementById('registrationBtn');
    const regLoginInput = document.getElementById('regLoginInput');
    const regPasswordInput = document.getElementById('regPasswordInput');
    const confirmRegBtn = document.getElementById('confirmRegBtn');
    const cancelRegBtn = document.getElementById('cancelRegBtn');
    const modalMsgSpan = document.getElementById('modalMsg');

    regBtn.addEventListener('click', () => {
        regLoginInput.value = '';
        regPasswordInput.value = '';
        modalMsgSpan.innerText = '';
        modal.style.display = 'flex';
    });

    function closeModal() {
        modal.style.display = 'none';
        modalMsgSpan.innerText = '';
    }

    cancelRegBtn.addEventListener('click', closeModal);
    window.addEventListener('click', (e) => {
        if (e.target === modal) closeModal();
    });

    confirmRegBtn.addEventListener('click', () => {
        const loginVal = regLoginInput.value;
        const passVal = regPasswordInput.value;
        const result = registerNewUser(loginVal, passVal);
        modalMsgSpan.innerText = result.message;
        if (result.success) {
            setTimeout(() => {
                closeModal();
                const errorDiv = document.getElementById('loginError');
                if (errorDiv) errorDiv.innerText = '✅ Регистрация прошла успешно! Теперь войдите.';
            }, 1300);
        }
    });

    // ------ Вход на Листе №1 ------
    const loginField = document.getElementById('loginField');
    const passwordField = document.getElementById('passwordField');
    const doLoginBtn = document.getElementById('doLoginBtn');
    const loginErrorSpan = document.getElementById('loginError');

    doLoginBtn.addEventListener('click', () => {
        const loginVal = loginField.value.trim();
        const passVal = passwordField.value;
        if (!loginVal || !passVal) {
            loginErrorSpan.innerText = '❌ Заполните оба поля';
            return;
        }
        if (checkLogin(loginVal, passVal)) {
            loginErrorSpan.innerText = '';
            showPage2();   // переход на Лист №2 при успешном входе
        } else {
            loginErrorSpan.innerText = 'Неверный логин или пароль';
        }
    });

    // Enter для полей входа
    [loginField, passwordField].forEach(input => {
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                doLoginBtn.click();
            }
        });
    });

    // ------ Кнопка "Назад" (шаг назад) на Листе2 → Лист1 ------
    const backBtn = document.getElementById('backToFirstPage');
    if (backBtn) {
        backBtn.addEventListener('click', () => {
            showPage1();
        });
    }

    // ------ Кнопка пешего похода (ссылка) ------
    const hikingBtn = document.getElementById('hikingBtn');
    if (hikingBtn) {
        hikingBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            window.open('https://rg.ru/2025/08/25/luchshie-marshruty-po-gornomu-altaiu-na-avtomobile-peshkom-i-konnye-pohody.html?ysclid=mohgf046bw735326745&utm_referrer=https%3A%2F%2Fya.ru%2F', '_blank');
        });
    }

    // ------ Кнопка сплава по воде (ссылка) ------
    const raftingBtn = document.getElementById('raftingBtn');
    if (raftingBtn) {
        raftingBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            window.open('https://altai-tour.ru/tours/filter/tour_type-is-water/apply/?etext=2202.hOSEY8i8jn4n9j0cERl849H3H2iX1ERBJ3gFZAW9nlxOPeD_SzT4dDPOkcCik8kxZnl1eWpkanV0YXNuamV4eg.8fe6de23a846ecfae2f2134de9642e36961d4d7e&yclid=8520827618768715775', '_blank');
        });
    }

    // Точное соответствие размерам и отступам:
    // - Кнопка регистрации: left:15mm, top:15mm;
    // - Блок "Войти" right:15mm, top:15mm; ширина авто;
    // - Заголовок: две строки "Путешествие" (100px) и "по Горному Алтаю" (70px), шрифт Algerian.
    // - Кнопки на 2-м листе: 5см x 8см (width:5cm; height:8cm). Первая: left=20mm, top=150mm; под ней надпись «Под рюкзаком».
    //   Вторая: left=12cm, top=150mm; под ней надпись «По воде».
    // - При клике на каждую картинку открываются соответствующие URL.
    // - Все фоны по ссылкам загружаются (при наличии интернета).
    // - Адаптация под разные экраны, сохранение пропорций A4.
    // - Также по условию: при нажатии на кнопку «Регистрация» выпадает окно с полями логин/пароль (модальное окно).
    // - Успешный вход -> переход на Лист №2.
    // Доп. тестовые данные: логин altai, пароль altai2025 для быстрой проверки входа.
    // Учтен пункт про Tkinter (не используется, только веб-технологии).
    console.log('Страница полностью готова: заголовки (100/70), регистрация, вход, карточки-кнопки 5x8 см, переходы.');
</script>
</body>
</html>
