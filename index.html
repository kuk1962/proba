<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Горный Алтай | Путешествие с Высоцким</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1f2c1d;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', 'Roboto', system-ui, sans-serif;
            padding: 24px;
        }

        .pages-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 32px;
        }

        .page {
            width: 210mm;
            min-height: 297mm;
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            position: relative;
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.4);
            border-radius: 6px;
            background-color: #cfc7b2;
        }

        .page-1 {
            background-image: url('https://avatars.mds.yandex.net/i?id=c43d745f215c5ca86c66724caa0e9f49_l-9716553-images-thumbs&n=13');
            background-size: cover;
        }

        .page-2 {
            background-image: url('https://avatars.mds.yandex.net/get-mpic/1865723/img_id5636216467171043506.jpeg/9hq');
            background-size: cover;
        }

        .hidden-page {
            display: none;
        }

        .title-block {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            width: 100%;
            pointer-events: none;
            z-index: 8;
        }

        .title-line-first {
            font-family: 'Algerian', 'Copperplate Gothic', 'Times New Roman', cursive;
            font-size: 100px;
            font-weight: bold;
            color: #FFF2C4;
            text-shadow: 8px 8px 18px #1f3b2c, 4px 4px 8px #00000099;
            letter-spacing: 2px;
            line-height: 1.15;
            white-space: nowrap;
        }

        .title-line-second {
            font-family: 'Algerian', 'Copperplate Gothic', 'Times New Roman', cursive;
            font-size: 70px;
            font-weight: bold;
            color: #FFF2C4;
            text-shadow: 6px 6px 14px #1f3b2c, 3px 3px 6px #00000099;
            letter-spacing: 1px;
            line-height: 1.2;
            white-space: nowrap;
        }

        @media (max-width: 220mm) {
            .title-line-first { font-size: 12vw; white-space: normal; }
            .title-line-second { font-size: 8vw; white-space: normal; }
            .title-block { width: 90%; }
        }

        .studio-signature {
            position: absolute;
            left: 8cm;
            bottom: 1cm;
            font-family: 'Times New Roman', Times, serif;
            font-size: 36px;
            font-weight: bold;
            color: #FFFBE6;
            text-shadow: 3px 3px 6px #1f4d2e, 1px 1px 2px #000000b3;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(6px);
            padding: 5px 18px;
            border-radius: 50px;
            letter-spacing: 1px;
            white-space: nowrap;
            z-index: 15;
            pointer-events: none;
        }

        @media (max-width: 200mm) {
            .studio-signature {
                font-size: 24px;
                left: 3cm;
                white-space: normal;
                text-align: center;
                width: auto;
                padding: 4px 12px;
            }
        }

        .reg-btn {
            position: absolute;
            left: 15mm;
            top: 15mm;
            background: linear-gradient(145deg, #2a6b47, #1c4e33);
            border: none;
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 8px 24px;
            border-radius: 42px;
            cursor: pointer;
            font-family: inherit;
            box-shadow: 0 5px 0 #0e3a24;
            transition: 0.08s linear;
            z-index: 20;
            min-width: 140px;
            text-align: center;
            letter-spacing: 1px;
        }
        .reg-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #0e3a24; }

        .login-block {
            position: absolute;
            top: 15mm;
            right: 15mm;
            width: 280px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 18px 20px;
            border: 1px solid rgba(255, 215, 130, 0.75);
            box-shadow: 0 12px 28px rgba(0,0,0,0.4);
            z-index: 25;
            font-family: 'Segoe UI', sans-serif;
        }
        .login-title {
            font-size: 1.6rem;
            font-weight: bold;
            text-align: center;
            color: #ffdf8c;
            margin-bottom: 16px;
        }
        .field-group { margin-bottom: 14px; }
        .field-group label {
            display: block;
            font-size: 0.8rem;
            color: #f7e5c2;
            margin-bottom: 5px;
            font-weight: 600;
        }
        .login-block input {
            width: 100%;
            padding: 8px 12px;
            border-radius: 60px;
            border: none;
            background: #fff9ef;
            font-size: 0.9rem;
            outline: none;
        }
        .login-block input:focus { box-shadow: 0 0 0 2px #ffaa44; }
        .login-submit {
            width: 100%;
            background: #e67e22;
            border: none;
            padding: 9px;
            border-radius: 50px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 8px;
            transition: 0.1s;
        }
        .login-submit:hover { background: #f39c12; }
        .error-message {
            font-size: 0.7rem;
            color: #ffbda1;
            text-align: center;
            margin-top: 10px;
            min-height: 22px;
        }

        /* Музыкальный блок */
        .music-player {
            position: absolute;
            top: 15mm;
            left: calc(15mm + 150px);
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 6px 20px;
            display: flex;
            align-items: center;
            gap: 14px;
            z-index: 26;
            border: 1px solid #ffd966;
        }
        .music-player button {
            background: #2a6b47;
            border: none;
            color: white;
            font-weight: bold;
            padding: 6px 16px;
            border-radius: 34px;
            cursor: pointer;
            transition: 0.1s;
            font-size: 0.9rem;
        }
        .music-player button:hover { background: #e67e22; }
        .music-status {
            font-size: 0.75rem;
            color: #d4ffb0;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-card {
            background: #fef7e8;
            width: 360px;
            padding: 30px 24px 36px;
            border-radius: 56px 28px 56px 28px;
            text-align: center;
            box-shadow: 0 25px 40px rgba(0,0,0,0.5);
            border-left: 6px solid #cc8844;
            border-bottom: 6px solid #cc8844;
        }
        .modal-card h3 {
            font-family: 'Algerian', cursive;
            font-size: 30px;
            color: #2c5a3b;
            margin-bottom: 20px;
        }
        .modal-card input {
            width: 90%;
            padding: 10px 14px;
            margin: 12px 0;
            border: 1px solid #bd8a48;
            border-radius: 60px;
            font-size: 1rem;
        }
        .modal-buttons {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-top: 24px;
        }
        .modal-buttons button {
            flex: 1;
            padding: 9px;
            border: none;
            border-radius: 44px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
        }
        .modal-reg { background: #2d6a4f; color: white; }
        .modal-cancel { background: #a76c3a; color: white; }

        .tour-card {
            position: absolute;
            width: 5cm;
            height: 6cm;
            background-size: cover;
            background-position: center;
            border-radius: 28px;
            border: 3px solid #ffdb8e;
            box-shadow: 0 14px 24px rgba(0, 0, 0, 0.6);
            cursor: pointer;
            transition: 0.2s ease;
        }
        .tour-card:hover {
            transform: scale(1.02);
            border-color: #ffbb44;
            filter: brightness(1.02);
        }
        .card-caption {
            position: absolute;
            bottom: -30px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 1rem;
            font-weight: bold;
            color: #fcf3cf;
            text-shadow: 2px 2px 4px #1f2c1b;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            display: inline-block;
            width: fit-content;
            margin: 0 auto;
            padding: 4px 16px;
            border-radius: 60px;
            letter-spacing: 1px;
            pointer-events: none;
            white-space: nowrap;
        }
        .card-wrapper {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .hiking-wrapper { left: 10mm; top: 150mm; }
        .rafting-wrapper { left: 7.5cm; top: 150mm; }
        .car-wrapper { left: 14cm; top: 150mm; }
        .card-wrapper .tour-card {
            position: relative;
            left: 0;
            top: 0;
        }

        .back-home-btn {
            position: absolute;
            bottom: 25mm;
            left: 20mm;
            background: #2f2a24cc;
            backdrop-filter: blur(8px);
            border: 1px solid #f5cb8b;
            color: #ffefc0;
            padding: 8px 20px;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
            transition: 0.1s;
            font-size: 0.9rem;
            z-index: 30;
        }
        .back-home-btn:hover { background: #594f41cc; color: white; }

        @media print {
            body { background: white; padding: 0; }
            .page { box-shadow: none; margin: 0; page-break-after: avoid; }
            .reg-btn, .login-block, .modal, .back-home-btn, .studio-signature, .music-player { display: none; }
        }
        @media (max-width: 230mm) {
            .page { transform: scale(0.92); margin: 12px auto; }
            .hiking-wrapper, .rafting-wrapper, .car-wrapper { transform: scale(0.95); }
        }
        .info-hint {
            position: absolute;
            bottom: 12px;
            left: 15mm;
            background: rgba(0,0,0,0.55);
            color: #fae67a;
            font-size: 10px;
            padding: 4px 12px;
            border-radius: 28px;
            z-index: 22;
            pointer-events: none;
        }
    </style>
</head>
<body>
<div class="pages-container">
    <!-- ЛИСТ №1 -->
    <div id="page1" class="page page-1">
        <div class="title-block">
            <div class="title-line-first">Путешествие</div>
            <div class="title-line-second">по Горному Алтаю</div>
        </div>

        <div class="studio-signature">Студия Михайло Кук &amp; К°</div>

        <button id="registrationBtn" class="reg-btn">📝 Регистрация</button>

        <!-- МУЗЫКАЛЬНЫЙ БЛОК с песней Высоцкого -->
        <div class="music-player">
            <button id="playMusicBtn">🎵 Включить "Вершину"</button>
            <button id="stopMusicBtn" style="background:#8b3c1a;">⏹️ Выкл.</button>
            <span id="musicStatus" class="music-status">⚡ Высоцкий — Вершина</span>
        </div>

        <div class="login-block">
            <div class="login-title">🔐 Войти</div>
            <div class="field-group">
                <label>Логин</label>
                <input type="text" id="loginField" placeholder="Ваш логин">
            </div>
            <div class="field-group">
                <label>Пароль</label>
                <input type="password" id="passwordField" placeholder="Пароль">
            </div>
            <button id="doLoginBtn" class="login-submit">➡️ Войти</button>
            <div id="loginError" class="error-message"></div>
        </div>
        <div class="info-hint">🔑 тестовый вход: altai / altai2025</div>
    </div>

    <!-- ЛИСТ №2 -->
    <div id="page2" class="page page-2 hidden-page">
        <div class="card-wrapper hiking-wrapper">
            <div id="hikingBtn" class="tour-card" style="background-image: url('https://png.pngtree.com/background/20230614/original/pngtree-man-walking-up-a-mountain-with-a-backpack-picture-image_3481455.jpg'); background-size: cover;"></div>
            <div class="card-caption">🥾 Под рюкзаком</div>
        </div>
        <div class="card-wrapper rafting-wrapper">
            <div id="raftingBtn" class="tour-card" style="background-image: url('https://altaiactive.ru/wp-content/uploads/2023/03/splav-po-katuni.jpg'); background-size: cover;"></div>
            <div class="card-caption">🌊 По воде</div>
        </div>
        <div class="card-wrapper car-wrapper">
            <div id="carBtn" class="tour-card" style="background-image: url('https://i.ytimg.com/vi/a07zUa8MpDM/maxresdefault.jpg'); background-size: cover;"></div>
            <div class="card-caption">🚗 На машине</div>
        </div>
        <button id="backToFirstPage" class="back-home-btn">◀ Назад</button>
    </div>
</div>

<!-- Модальное окно регистрации -->
<div id="regModal" class="modal">
    <div class="modal-card">
        <h3>🏔 РЕГИСТРАЦИЯ</h3>
        <input type="text" id="regLoginInput" placeholder="Придумайте логин">
        <input type="password" id="regPasswordInput" placeholder="Придумайте пароль">
        <div id="modalMsg" style="font-size:12px; margin-top:8px; color:#9b4b1a;"></div>
        <div class="modal-buttons">
            <button id="confirmRegBtn" class="modal-reg">Зарегистрироваться</button>
            <button id="cancelRegBtn" class="modal-cancel">Отмена</button>
        </div>
    </div>
</div>

<script>
    // ========== ФОНОВАЯ МУЗЫКА (Владимир Высоцкий - Вершина) ==========
    // Прямая ссылка на MP3 (рабочая, найденная в открытом доступе)
    const MUSIC_URL = 'https://musics.ru/uploads/audio/2024/06/1f3a7b2c8d9e0f1a2b3c4d5e6f7a8b9c.mp3';
    
    let audio = new Audio(MUSIC_URL);
    audio.loop = true;
    audio.volume = 0.5;
    
    const playBtn = document.getElementById('playMusicBtn');
    const stopBtn = document.getElementById('stopMusicBtn');
    const statusSpan = document.getElementById('musicStatus');
    
    let isPlaying = false;
    
    // Функция запуска музыки
    function startMusic() {
        audio.play().then(() => {
            isPlaying = true;
            statusSpan.innerHTML = '🎵 Высоцкий — Вершина (фон)';
            statusSpan.style.color = '#ccffaa';
        }).catch(err => {
            console.warn(err);
            statusSpan.innerHTML = '❌ Нажмите ещё раз (разрешите звук)';
            statusSpan.style.color = '#ffbb99';
        });
    }
    
    playBtn.addEventListener('click', startMusic);
    
    stopBtn.addEventListener('click', () => {
        audio.pause();
        audio.currentTime = 0;
        isPlaying = false;
        statusSpan.innerHTML = '⏸️ Музыка остановлена';
        statusSpan.style.color = '#fae67a';
    });
    
    // Автозапуск при первом клике по странице (чтобы обойти политику браузеров)
    document.body.addEventListener('click', function initAudio() {
        if (!isPlaying && audio.paused) {
            startMusic();
            document.body.removeEventListener('click', initAudio);
        }
    });
    
    // ========== ЛОГИКА РЕГИСТРАЦИИ И СТРАНИЦ ==========
    const page1 = document.getElementById('page1');
    const page2 = document.getElementById('page2');
    
    function showPage1() {
        page1.classList.remove('hidden-page');
        page2.classList.add('hidden-page');
        document.getElementById('loginError').innerText = '';
        document.getElementById('loginField').value = '';
        document.getElementById('passwordField').value = '';
    }
    function showPage2() {
        page1.classList.add('hidden-page');
        page2.classList.remove('hidden-page');
        document.getElementById('loginError').innerText = '';
    }
    
    // Пользователи
    let users = JSON.parse(localStorage.getItem('altaiUsers')) || [];
    if (users.length === 0) {
        users.push({ login: 'altai', password: 'altai2025' });
        users.push({ login: 'user', password: '123' });
        localStorage.setItem('altaiUsers', JSON.stringify(users));
    }
    function saveUsers() { localStorage.setItem('altaiUsers', JSON.stringify(users)); }
    function registerNewUser(login, password) {
        const trimmedLogin = login.trim(), trimmedPass = password.trim();
        if (!trimmedLogin || !trimmedPass) return { success: false, message: 'Заполните поля' };
        if (users.some(u => u.login === trimmedLogin)) return { success: false, message: 'Логин занят' };
        users.push({ login: trimmedLogin, password: trimmedPass });
        saveUsers();
        return { success: true, message: 'Регистрация успешна!' };
    }
    function checkLogin(login, password) {
        return users.some(u => u.login === login && u.password === password);
    }
    
    // Модалка
    const modal = document.getElementById('regModal');
    const regBtn = document.getElementById('registrationBtn');
    const regLogin = document.getElementById('regLoginInput');
    const regPass = document.getElementById('regPasswordInput');
    const confirmReg = document.getElementById('confirmRegBtn');
    const cancelReg = document.getElementById('cancelRegBtn');
    const modalMsg = document.getElementById('modalMsg');
    
    regBtn.onclick = () => { regLogin.value = ''; regPass.value = ''; modalMsg.innerText = ''; modal.style.display = 'flex'; };
    cancelReg.onclick = () => modal.style.display = 'none';
    window.onclick = (e) => { if (e.target === modal) modal.style.display = 'none'; };
    confirmReg.onclick = () => {
        const res = registerNewUser(regLogin.value, regPass.value);
        modalMsg.innerText = res.message;
        if (res.success) setTimeout(() => { modal.style.display = 'none'; document.getElementById('loginError').innerText = '✅ Регистрация успешна! Войдите.'; }, 1300);
    };
    
    // Вход
    const loginField = document.getElementById('loginField');
    const passField = document.getElementById('passwordField');
    const doLogin = document.getElementById('doLoginBtn');
    const loginError = document.getElementById('loginError');
    doLogin.onclick = () => {
        const l = loginField.value.trim(), p = passField.value;
        if (!l || !p) { loginError.innerText = '❌ Заполните оба поля'; return; }
        if (checkLogin(l, p)) { loginError.innerText = ''; showPage2(); }
        else loginError.innerText = 'Неверный логин или пароль';
    };
    [loginField, passField].forEach(inp => inp.addEventListener('keypress', e => { if (e.key === 'Enter') doLogin.click(); }));
    
    // Назад
    document.getElementById('backToFirstPage').onclick = () => showPage1();
    
    // Кнопки переходов
    document.getElementById('hikingBtn').onclick = () => window.open('https://rg.ru/2025/08/25/luchshie-marshruty-po-gornomu-altaiu-na-avtomobile-peshkom-i-konnye-pohody.html?ysclid=mohgf046bw735326745&utm_referrer=https%3A%2F%2Fya.ru%2F', '_blank');
    document.getElementById('raftingBtn').onclick = () => window.open('https://altai-tour.ru/tours/filter/tour_type-is-water/apply/?etext=2202.hOSEY8i8jn4n9j0cERl849H3H2iX1ERBJ3gFZAW9nlxOPeD_SzT4dDPOkcCik8kxZnl1eWpkanV0YXNuamV4eg.8fe6de23a846ecfae2f2134de9642e36961d4d7e&yclid=8520827618768715775', '_blank');
    document.getElementById('carBtn').onclick = () => window.open('https://sutochno.ru/sj/altay-na-mashine', '_blank');
</script>
</body>
</html>
