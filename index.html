<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Горный Алтай | Два листа с сеткой 1 см</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            width: 100%;
            scroll-behavior: smooth;
        }

        body {
            background: #1f2c1d;
            font-family: 'Segoe UI', 'Roboto', system-ui, sans-serif;
            position: relative;
        }

        /* Общий контейнер для страниц (вертикальная прокрутка) */
        .pages-scroll {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        /* Стиль каждого листа — на всю высоту экрана */
        .fullscreen-page {
            width: 100%;
            min-height: 100vh;
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            position: relative;
            background-color: #2e5a3e;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow-x: auto;
            flex-shrink: 0;
        }

        /* Лист №1 фон */
        .page-1 {
            background-image: url('https://avatars.mds.yandex.net/i?id=c43d745f215c5ca86c66724caa0e9f49_l-9716553-images-thumbs&n=13');
            background-size: cover;
        }

        /* Лист №2 фон (карта Altaic) */
        .page-2 {
            background-image: url('https://saletur.ru/galery/tfoto_map/big/4353.jpg');
            background-size: cover;
        }

        /* === САНТИМЕТРОВАЯ СЕТКА для обоих листов (1см x 1см) === */
        .grid-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 55;
        }
        .grid-pattern {
            width: 100%;
            height: 100%;
            background-image: 
                repeating-linear-gradient(
                    to right,
                    rgba(255, 80, 80, 0.65) 0px,
                    rgba(255, 80, 80, 0.65) 1px,
                    transparent 1px,
                    transparent 1cm
                ),
                repeating-linear-gradient(
                    to bottom,
                    rgba(255, 80, 80, 0.65) 0px,
                    rgba(255, 80, 80, 0.65) 1px,
                    transparent 1px,
                    transparent 1cm
                ),
                repeating-linear-gradient(
                    to right,
                    rgba(200, 20, 20, 0.8) 0px,
                    rgba(200, 20, 20, 0.8) 2px,
                    transparent 2px,
                    transparent 5cm
                ),
                repeating-linear-gradient(
                    to bottom,
                    rgba(200, 20, 20, 0.8) 0px,
                    rgba(200, 20, 20, 0.8) 2px,
                    transparent 2px,
                    transparent 5cm
                );
            background-repeat: repeat;
            background-position: top left;
        }

        /* Контейнер для двухстрочного заголовка (центр экрана) */
        .title-block {
            text-align: center;
            width: 100%;
            pointer-events: none;
            z-index: 8;
            position: relative;
            margin-bottom: 20px;
        }

        .title-line-first {
            font-family: 'Algerian', 'Copperplate Gothic', 'Times New Roman', cursive;
            font-size: 100px;
            font-weight: bold;
            color: #FFF2C4;
            text-shadow: 8px 8px 18px #1f3b2c, 4px 4px 8px #00000099;
            letter-spacing: 2px;
            line-height: 1.15;
            white-space: nowrap;
        }

        .title-line-second {
            font-family: 'Algerian', 'Copperplate Gothic', 'Times New Roman', cursive;
            font-size: 70px;
            font-weight: bold;
            color: #FFF2C4;
            text-shadow: 6px 6px 14px #1f3b2c, 3px 3px 6px #00000099;
            letter-spacing: 1px;
            line-height: 1.2;
            white-space: nowrap;
        }

        @media (max-width: 220mm) {
            .title-line-first { font-size: 12vw; white-space: normal; }
            .title-line-second { font-size: 8vw; white-space: normal; }
        }

        /* Студийная надпись: 18 см от левого края, 1см от нижнего края */
        .studio-signature {
            position: absolute;
            left: 18cm;
            bottom: 1cm;
            font-family: 'Times New Roman', Times, serif;
            font-size: 16px;
            font-weight: bold;
            color: #FFFBE6;
            text-shadow: 2px 2px 4px #1f4d2e;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(4px);
            padding: 4px 14px;
            border-radius: 30px;
            letter-spacing: 0.5px;
            white-space: nowrap;
            z-index: 15;
            pointer-events: none;
        }
        @media (max-width: 300mm) {
            .studio-signature {
                left: auto;
                right: 1cm;
                white-space: normal;
                text-align: center;
                font-size: 12px;
            }
        }

        /* Кнопка Регистрация (левый верх: 15мм) */
        .reg-btn {
            position: absolute;
            left: 15mm;
            top: 15mm;
            background: linear-gradient(145deg, #2a6b47, #1c4e33);
            border: none;
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            padding: 6px 18px;
            border-radius: 40px;
            cursor: pointer;
            font-family: inherit;
            box-shadow: 0 4px 0 #0e3a24;
            transition: 0.08s linear;
            z-index: 20;
            min-width: 130px;
            text-align: center;
        }
        .reg-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #0e3a24; }

        /* Блок "Войти" — размер 5см х 5см, отступ справа 1.5см, сверху 15мм */
        .login-block {
            position: absolute;
            top: 15mm;
            right: 1.5cm;
            width: 5cm;
            height: 5cm;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 8px 10px;
            border: 1px solid rgba(255, 215, 130, 0.7);
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            z-index: 25;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .login-title {
            font-size: 1rem;
            font-weight: bold;
            text-align: center;
            color: #ffdf8c;
            margin-bottom: 4px;
        }
        .field-group {
            margin-bottom: 6px;
        }
        .field-group label {
            display: block;
            font-size: 0.65rem;
            color: #f7e5c2;
            margin-bottom: 2px;
        }
        .login-block input {
            width: 100%;
            padding: 6px 8px;
            border-radius: 50px;
            border: none;
            background: #fff9ef;
            font-size: 0.7rem;
            outline: none;
        }
        .login-block input:focus { box-shadow: 0 0 0 2px #ffaa44; }
        .login-submit {
            width: 100%;
            background: #e67e22;
            border: none;
            padding: 5px;
            border-radius: 40px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            font-size: 0.75rem;
            margin-top: 6px;
            transition: 0.1s;
        }
        .login-submit:hover { background: #f39c12; }
        .error-message {
            font-size: 0.55rem;
            color: #ffbda1;
            text-align: center;
            margin-top: 4px;
        }

        /* Стили карточек (кнопок) второго листа - размер 75мм x 90мм */
        .tour-card {
            position: absolute;
            width: 75mm;
            height: 90mm;
            background-size: cover;
            background-position: center;
            border-radius: 20px;
            border: 3px solid #ffdb8e;
            box-shadow: 0 14px 24px rgba(0, 0, 0, 0.6);
            cursor: pointer;
            transition: 0.2s ease;
        }
        .tour-card:hover {
            transform: scale(1.02);
            border-color: #ffbb44;
            filter: brightness(1.02);
        }
        .card-caption {
            position: absolute;
            bottom: -30px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 1rem;
            font-weight: bold;
            color: #fcf3cf;
            text-shadow: 2px 2px 4px #1f2c1b;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            display: inline-block;
            width: fit-content;
            margin: 0 auto;
            padding: 4px 16px;
            border-radius: 60px;
            letter-spacing: 1px;
            pointer-events: none;
            white-space: nowrap;
        }
        .card-wrapper {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        /* Отступы согласно ТЗ: от левого края 50мм, 135мм, 220мм; от верхнего края 150мм */
        .hiking-wrapper { left: 50mm; top: 150mm; }
        .rafting-wrapper { left: 135mm; top: 150mm; }
        .car-wrapper { left: 220mm; top: 150mm; }
        .card-wrapper .tour-card {
            position: relative;
            left: 0;
            top: 0;
        }

        /* Кнопка возврата на Лист №1 */
        .back-home-btn {
            position: absolute;
            bottom: 25mm;
            left: 20mm;
            background: #2f2a24cc;
            backdrop-filter: blur(8px);
            border: 1px solid #f5cb8b;
            color: #ffefc0;
            padding: 8px 20px;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
            transition: 0.1s;
            font-size: 0.9rem;
            z-index: 30;
        }
        .back-home-btn:hover { background: #594f41cc; color: white; }

        /* Модальное окно регистрации */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-card {
            background: #fef7e8;
            width: 340px;
            padding: 24px 20px 28px;
            border-radius: 48px 24px 48px 24px;
            text-align: center;
            box-shadow: 0 25px 40px rgba(0,0,0,0.5);
            border-left: 5px solid #cc8844;
            border-bottom: 5px solid #cc8844;
        }
        .modal-card h3 {
            font-family: 'Algerian', cursive;
            font-size: 26px;
            color: #2c5a3b;
            margin-bottom: 16px;
        }
        .modal-card input {
            width: 90%;
            padding: 10px 14px;
            margin: 10px 0;
            border: 1px solid #bd8a48;
            border-radius: 60px;
            font-size: 0.9rem;
        }
        .modal-buttons {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-top: 18px;
        }
        .modal-buttons button {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 44px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
        }
        .modal-reg { background: #2d6a4f; color: white; }
        .modal-cancel { background: #a76c3a; color: white; }

        /* Вспомогательная подсказка */
        .info-hint {
            position: absolute;
            bottom: 12px;
            left: 15mm;
            background: rgba(0,0,0,0.55);
            color: #fae67a;
            font-size: 9px;
            padding: 3px 10px;
            border-radius: 28px;
            z-index: 22;
            pointer-events: none;
        }

        @media print {
            .grid-overlay { display: none; }
            .reg-btn, .login-block, .modal, .back-home-btn { display: none; }
        }
    </style>
</head>
<body>
<div class="pages-scroll">
    <!-- ЛИСТ №1 -->
    <div id="page1" class="fullscreen-page page-1">
        <div class="grid-overlay"><div class="grid-pattern"></div></div>
        <div class="title-block">
            <div class="title-line-first">Путешествие</div>
            <div class="title-line-second">по Горному Алтаю</div>
        </div>
        <div class="studio-signature">Студия Михайло Кук &amp; К°</div>
        <button id="registrationBtn" class="reg-btn">📝 Регистрация</button>
        <div class="login-block">
            <div class="login-title">🔐 Войти</div>
            <div class="field-group">
                <label>Логин</label>
                <input type="text" id="loginField" placeholder="Логин">
            </div>
            <div class="field-group">
                <label>Пароль</label>
                <input type="password" id="passwordField" placeholder="Пароль">
            </div>
            <button id="doLoginBtn" class="login-submit">Войти</button>
            <div id="loginError" class="error-message"></div>
        </div>
        <div class="info-hint">🔑 тестовый вход: altai / altai2025</div>
    </div>

    <!-- ЛИСТ №2 -->
    <div id="page2" class="fullscreen-page page-2" style="display: none;">
        <div class="grid-overlay"><div class="grid-pattern"></div></div>
        <div class="card-wrapper hiking-wrapper">
            <div id="hikingBtn" class="tour-card" style="background-image: url('https://png.pngtree.com/background/20230614/original/pngtree-man-walking-up-a-mountain-with-a-backpack-picture-image_3481455.jpg'); background-size: cover;"></div>
            <div class="card-caption">🥾 Под рюкзаком</div>
        </div>
        <div class="card-wrapper rafting-wrapper">
            <div id="raftingBtn" class="tour-card" style="background-image: url('https://altaiactive.ru/wp-content/uploads/2023/03/splav-po-katuni.jpg'); background-size: cover;"></div>
            <div class="card-caption">🌊 По воде</div>
        </div>
        <div class="card-wrapper car-wrapper">
            <div id="carBtn" class="tour-card" style="background-image: url('https://i.ytimg.com/vi/a07zUa8MpDM/maxresdefault.jpg'); background-size: cover;"></div>
            <div class="card-caption">🚗 На машине</div>
        </div>
        <button id="backToFirstPage" class="back-home-btn">◀ Назад (Лист №1)</button>
    </div>
</div>

<!-- Модальное окно регистрации -->
<div id="regModal" class="modal">
    <div class="modal-card">
        <h3>🏔 РЕГИСТРАЦИЯ</h3>
        <input type="text" id="regLoginInput" placeholder="Придумайте логин">
        <input type="password" id="regPasswordInput" placeholder="Придумайте пароль">
        <div id="modalMsg" style="font-size:12px; margin-top:6px; color:#9b4b1a;"></div>
        <div class="modal-buttons">
            <button id="confirmRegBtn" class="modal-reg">Зарегистрироваться</button>
            <button id="cancelRegBtn" class="modal-cancel">Отмена</button>
        </div>
    </div>
</div>

<script>
    // ========== ЗАПОМИНАНИЕ ЛОГИНА И ПАРОЛЯ ==========
    const SAVED_LOGIN_KEY = 'savedAltaiLogin';
    const SAVED_PASS_KEY = 'savedAltaiPass';

    function saveCredentials(login, password) {
        if (login && password) {
            localStorage.setItem(SAVED_LOGIN_KEY, login);
            localStorage.setItem(SAVED_PASS_KEY, password);
        } else {
            localStorage.removeItem(SAVED_LOGIN_KEY);
            localStorage.removeItem(SAVED_PASS_KEY);
        }
    }

    function loadSavedCredentials() {
        const savedLogin = localStorage.getItem(SAVED_LOGIN_KEY);
        const savedPass = localStorage.getItem(SAVED_PASS_KEY);
        if (savedLogin) document.getElementById('loginField').value = savedLogin;
        if (savedPass) document.getElementById('passwordField').value = savedPass;
    }

    // ------ Работа с пользователями ------
    let users = JSON.parse(localStorage.getItem('altaiUsers')) || [];
    if (users.length === 0) {
        users.push({ login: 'altai', password: 'altai2025' });
        users.push({ login: 'user', password: '123' });
        localStorage.setItem('altaiUsers', JSON.stringify(users));
    }

    function saveUsersToStorage() {
        localStorage.setItem('altaiUsers', JSON.stringify(users));
    }

    function registerNewUser(login, password) {
        const trimmedLogin = login.trim();
        const trimmedPass = password.trim();
        if (!trimmedLogin || !trimmedPass) {
            return { success: false, message: 'Логин и пароль не могут быть пустыми' };
        }
        const exists = users.some(u => u.login === trimmedLogin);
        if (exists) {
            return { success: false, message: 'Пользователь с таким логином уже существует' };
        }
        users.push({ login: trimmedLogin, password: trimmedPass });
        saveUsersToStorage();
        return { success: true, message: 'Регистрация успешна! Теперь войдите.' };
    }

    function checkLogin(login, password) {
        return users.some(u => u.login === login && u.password === password);
    }

    // ------ Модальное окно регистрации ------
    const modal = document.getElementById('regModal');
    const regBtn = document.getElementById('registrationBtn');
    const regLoginInput = document.getElementById('regLoginInput');
    const regPasswordInput = document.getElementById('regPasswordInput');
    const confirmRegBtn = document.getElementById('confirmRegBtn');
    const cancelRegBtn = document.getElementById('cancelRegBtn');
    const modalMsgSpan = document.getElementById('modalMsg');

    regBtn.addEventListener('click', () => {
        regLoginInput.value = '';
        regPasswordInput.value = '';
        modalMsgSpan.innerText = '';
        modal.style.display = 'flex';
    });

    function closeModal() {
        modal.style.display = 'none';
        modalMsgSpan.innerText = '';
    }

    cancelRegBtn.addEventListener('click', closeModal);
    window.addEventListener('click', (e) => {
        if (e.target === modal) closeModal();
    });

    confirmRegBtn.addEventListener('click', () => {
        const loginVal = regLoginInput.value;
        const passVal = regPasswordInput.value;
        const result = registerNewUser(loginVal, passVal);
        modalMsgSpan.innerText = result.message;
        if (result.success) {
            setTimeout(() => {
                closeModal();
                const errorDiv = document.getElementById('loginError');
                if (errorDiv) errorDiv.innerText = '✅ Регистрация успешна! Войдите.';
                if (loginVal && passVal) {
                    document.getElementById('loginField').value = loginVal;
                    document.getElementById('passwordField').value = passVal;
                    saveCredentials(loginVal, passVal);
                }
            }, 1300);
        }
    });

    // ------ Вход с запоминанием и переходом на Лист2 ------
    const loginField = document.getElementById('loginField');
    const passwordField = document.getElementById('passwordField');
    const doLoginBtn = document.getElementById('doLoginBtn');
    const loginErrorSpan = document.getElementById('loginError');
    const page1Div = document.getElementById('page1');
    const page2Div = document.getElementById('page2');

    function showPage2() {
        page1Div.style.display = 'none';
        page2Div.style.display = 'flex';
        page2Div.scrollIntoView({ behavior: 'smooth' });
    }

    function showPage1() {
        page1Div.style.display = 'flex';
        page2Div.style.display = 'none';
        page1Div.scrollIntoView({ behavior: 'smooth' });
    }

    loadSavedCredentials();

    doLoginBtn.addEventListener('click', () => {
        const loginVal = loginField.value.trim();
        const passVal = passwordField.value;
        if (!loginVal || !passVal) {
            loginErrorSpan.innerText = '❌ Заполните оба поля';
            return;
        }
        if (checkLogin(loginVal, passVal)) {
            loginErrorSpan.innerText = '';
            saveCredentials(loginVal, passVal);
            showPage2();   // переход на Лист №2
        } else {
            loginErrorSpan.innerText = 'Неверный логин или пароль';
        }
    });

    [loginField, passwordField].forEach(input => {
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                doLoginBtn.click();
            }
        });
    });

    // ------ Кнопка "Назад" на Листе2 -> Лист1 ------
    const backBtn = document.getElementById('backToFirstPage');
    if (backBtn) {
        backBtn.addEventListener('click', () => {
            showPage1();
        });
    }

    // ------ Кнопки переходов (Лист №2) ------
    const hikingBtn = document.getElementById('hikingBtn');
    if (hikingBtn) {
        hikingBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            window.open('https://rg.ru/2025/08/25/luchshie-marshruty-po-gornomu-altaiu-na-avtomobile-peshkom-i-konnye-pohody.html?ysclid=mohgf046bw735326745&utm_referrer=https%3A%2F%2Fya.ru%2F', '_blank');
        });
    }

    const raftingBtn = document.getElementById('raftingBtn');
    if (raftingBtn) {
        raftingBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            window.open('https://altai-tour.ru/tours/filter/tour_type-is-water/apply/?etext=2202.hOSEY8i8jn4n9j0cERl849H3H2iX1ERBJ3gFZAW9nlxOPeD_SzT4dDPOkcCik8kxZnl1eWpkanV0YXNuamV4eg.8fe6de23a846ecfae2f2134de9642e36961d4d7e&yclid=8520827618768715775', '_blank');
        });
    }

    const carBtn = document.getElementById('carBtn');
    if (carBtn) {
        carBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            window.open('https://sutochno.ru/sj/altay-na-mashine', '_blank');
        });
    }
</script>
</body>
</html>
